<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="SAOS">
  <!--
    The SAOS wordmark compressed to a mark: an "S" in verdigris on ink, rounded
    square, hairline in verdigris-dim — the same three token values the sidebar
    logo uses (ink #0e1116, verdigris #57b57c, verdigris-dim #2c4e3b), so the
    tab and the app are recognisably one thing.

    The letter is a stroked PATH, not <text>. A favicon renders outside the
    page, so it cannot see the Sora webfont, and a text-based mark would
    silently fall back to whatever the OS picked and look different on every
    machine. The stroke is heavy (7 units of 64) so the glyph still reads at
    16px in a tab strip.

    width and height are present as well as viewBox, and are load-bearing: an
    SVG with only a viewBox has no intrinsic size, so an img reports
    naturalWidth 0.
  -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0e1116" stroke="#2c4e3b" stroke-width="2" />
  <path d="M43 21.5 C40.5 16.5 22 15 21 24.5 C20 34 44 30 44 40.5 C44 50 24 50 20.5 43"
        fill="none" stroke="#57b57c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
