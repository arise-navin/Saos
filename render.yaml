services:
  - type: web
    name: saos-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: node server/src/index.js
    healthCheckPath: /healthz
    disk:
      name: saos-data
      mountPath: /var/data/saos
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: SAOS_DATA_DIR
        value: /var/data/saos
      - key: FRONTEND_ORIGIN
        sync: false
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: TURSO_DATABASE_URL
        value: libsql://saos-v2-navin-patel.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
